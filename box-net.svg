<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <title>箱の展開図 200×80×100 mm</title>
  <desc>幅200mm、奥行き80mm、高さ100mm、のりしろ10mmの箱型展開図</desc>
  <rect width="900" height="620" fill="white"/>
  <style>
    .cut{fill:#eaf3ff;stroke:#d62828;stroke-width:3}
    .fold{fill:none;stroke:#1769aa;stroke-width:2;stroke-dasharray:10 7}
    .glue{fill:#fff1b8;stroke:#d62828;stroke-width:3}
    .label{font-family:Arial,'Noto Sans JP',sans-serif;fill:#222;text-anchor:middle}
    .small{font-size:16px}.large{font-size:22px;font-weight:bold}
  </style>
  <text x="450" y="34" class="label large">箱型 展開図（単位：mm）</text>
  <!-- net: scale 2px/mm; main body panels: 200 x 100, 80 x 100, 200 x 100, 80 x 100 -->
  <!-- left glue tab -->
  <polygon class="glue" points="70,250 90,230 90,430 70,410"/>
  <!-- side panel -->
  <rect class="cut" x="90" y="250" width="160" height="200"/>
  <!-- front panel -->
  <rect class="cut" x="250" y="250" width="400" height="200"/>
  <!-- side panel -->
  <rect class="cut" x="650" y="250" width="160" height="200"/>
  <!-- bottom flap -->
  <rect class="cut" x="250" y="450" width="400" height="160"/>
  <!-- top flap -->
  <rect class="cut" x="250" y="90" width="400" height="160"/>
  <!-- fold lines -->
  <line class="fold" x1="90" y1="250" x2="810" y2="250"/>
  <line class="fold" x1="90" y1="450" x2="810" y2="450"/>
  <line class="fold" x1="250" y1="90" x2="250" y2="610"/>
  <line class="fold" x1="650" y1="90" x2="650" y2="610"/>
  <!-- labels -->
  <text x="170" y="355" class="label large">側面</text>
  <text x="450" y="355" class="label large">正面 200×100</text>
  <text x="730" y="355" class="label large">側面</text>
  <text x="450" y="175" class="label large">フタ 200×80</text>
  <text x="450" y="535" class="label large">底 200×80</text>
  <text x="80" y="475" class="label small">のりしろ 10</text>
  <text x="450" y="78" class="label small">切断線：赤　　折り線：青破線　　のりしろ：黄色</text>
  <!-- dimensions -->
  <line x1="250" y1="635" x2="650" y2="635" stroke="#333"/>
  <text x="450" y="615" class="label small">200</text>
  <line x1="830" y1="250" x2="830" y2="450" stroke="#333"/>
  <text x="850" y="355" class="label small" transform="rotate(90 850 355)">100</text>
</svg>
